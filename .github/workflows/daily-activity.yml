name: Daily Activity

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity-main
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "rafenitraa@gmail.com"
          git config --global user.name "Rafenitra Andriantsoa"

      - name: Sync with remote main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Run activity check
        run: |
          echo "✅ Daily check - $(date +'%Y-%m-%d')" >> activity.log
          tail -30 activity.log > activity.log.tmp
          mv activity.log.tmp activity.log

      - name: Commit activity
        run: |
          git add activity.log

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: daily activity log [$(date +'%Y-%m-%d')]"

      - name: Push changes
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
