name: Daily Activity

on:
  schedule:
    # Tourne du lundi au vendredi à 7h UTC
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
 contents: write


jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run activity check
        run: |
          echo "✅ Daily check - $(date +'%Y-%m-%d')" >> activity.log
          tail -30 activity.log > activity.log.tmp && mv activity.log.tmp activity.log

      - name: Commit activity
        run: |
          git config --global user.email "rafenitraa@gmail.com"
          git config --global user.name "Rafenitra Andriantsoa"
          git add activity.log
          git diff --staged --quiet || git commit -m "chore: daily activity log [$(date +'%Y-%m-%d')]"
          git push
